appId: app.fitly.mobile
name: Signup to private AI fitting
tags:
  - phase-one
  - smoke
---
- addMedia:
    - fixtures/synthetic-adult-body.jpg
    - fixtures/synthetic-green-overshirt.jpg
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: "Welcome back."
- scrollUntilVisible:
    element: "Create an account"
    direction: DOWN
- tapOn: "Create an account"
- tapOn:
    id: "auth-birth-date-input"
- inputText: "1990-01-01"
- tapOn:
    id: "auth-name-input"
- inputText: "Fitly Test Member"
- pressKey: Enter
- inputText: ${E2E_EMAIL}
- pressKey: Enter
- tapOn:
    point: "91%,58%"
    optional: true
- tapOn:
    id: "auth-password-input"
- inputText: ${E2E_PASSWORD}
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
- assertVisible: "Your closet, on you."
- tapOn: "Start my closet"

# Add the first gallery image as the approved body-photo fixture.
- tapOn: "Add body photo"
- tapOn: "Choose from library"
- waitForAnimationToEnd
- tapOn:
    id: "PXGGridLayout-Info"
    index: 1
- assertVisible: "Selected body photo"
- tapOn: "Save private photo"
- extendedWaitUntil:
    visible: "The Studio"
    timeout: 30000

# Select the second gallery image and save it with a manual category so the
# garment path does not depend on automatic tagging.
- tapOn: "Add piece"
- tapOn: "Choose garment photos"
- waitForAnimationToEnd
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- tapOn:
    text: "Add"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- assertVisible: "Selected garment photo"
- tapOn: "Garment name"
- inputText: "E2E linen shirt"
- pressKey: Enter
- tapOn: "Tops category"
- tapOn: "Add to my closet"
- extendedWaitUntil:
    visible: "Try it on"
    timeout: 60000

- tapOn: "Try it on"
- extendedWaitUntil:
    visible: "Your Fitly fitting is ready"
    timeout: 180000
- assertVisible: "Only you can see this"
- assertVisible: "How’s the fit?"
