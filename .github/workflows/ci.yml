name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type, test, and export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage -- --ci

      - name: Check for PII leakage
        run: npm run check:pii

      - name: Validate Expo dependencies
        run: npx expo-doctor

      - name: Export web app
        run: npm run build:web

      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

  database-security:
    name: Database RLS policies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start local Supabase
        run: supabase start

      - name: Test database policies
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
